<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마트 라오어 30일 완성</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto Sans Lao:wght@300;400;600&family=Noto Sans KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lao-red: #ce1126;
    --lao-gold: #f5a623;
    --lao-blue: #002868;
    --lao-light: #fff8e1;
    --lao-cream: #fdf6e3;
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #f39c12;
    --green: #2ea043;
    --border: #30363d;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 패턴 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 10%, rgba(192,57,43,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(243,156,18,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 10%, rgba(26,35,126,0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 20px; }

  /* 헤더 */
  .header {
    text-align: center;
    padding: 40px 20px 30px;
    position: relative;
  }
  .header-flag {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .header h1 {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--lao-gold), #e74c3c, var(--lao-gold));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    letter-spacing: -0.5px;
  }
  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  .header p { color: var(--text2); font-size: 14px; margin-top: 6px; }
  .lao-subtitle {
    font-family: 'Noto Sans Lao', sans-serif;
    font-size: 18px;
    color: var(--lao-gold);
    opacity: 0.8;
    margin-top: 4px;
  }

  /* 진행 상태 */
  .progress-bar-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    height: 8px;
    margin: 16px 0 6px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--lao-red), var(--lao-gold));
    border-radius: 50px;
    transition: width 0.6s cubic-bezier(.4,2,.6,1);
  }
  .progress-label { color: var(--text2); font-size: 12px; text-align: center; }

  /* 탭 */
  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin: 20px 0;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 10px 8px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text2);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--lao-red), #e74c3c);
    color: white;
    box-shadow: 0 2px 8px rgba(192,57,43,0.4);
  }
  .tab:hover:not(.active) { background: var(--surface2); color: var(--text); }

  /* 날짜 선택기 */
  .day-selector {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 24px;
  }
  .day-btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .day-btn.locked {
    background: var(--surface);
    color: var(--text2);
    border: 1px solid var(--border);
    cursor: not-allowed;
  }
  .day-btn.available {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .day-btn.available:hover {
    border-color: var(--lao-gold);
    color: var(--lao-gold);
    transform: scale(1.05);
  }
  .day-btn.completed {
    background: linear-gradient(135deg, #1a3a1a, #2ea043);
    color: #7ee787;
    border: 1px solid #2ea043;
  }
  .day-btn.current {
    background: linear-gradient(135deg, var(--lao-red), #e74c3c);
    color: white;
    border: 1px solid var(--lao-gold);
    box-shadow: 0 0 12px rgba(192,57,43,0.5);
    animation: pulse 2s infinite;
  }
  .day-btn.review-day {
    background: linear-gradient(135deg, #1a237e, #283593);
    color: #90caf9;
    border: 1px solid #3f51b5;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 12px rgba(192,57,43,0.5); }
    50% { box-shadow: 0 0 20px rgba(192,57,43,0.8); }
  }
  .day-btn.completed::after {
    content: '✓';
    position: absolute;
    top: 1px; right: 3px;
    font-size: 8px;
  }

  /* 오늘의 학습 카드 */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* 문장 카드 */
  .sentence-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
    transition: all 0.25s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .sentence-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--lao-red), var(--lao-gold));
    border-radius: 3px 0 0 3px;
  }
  .sentence-card:hover {
    border-color: rgba(243,156,18,0.4);
    transform: translateX(3px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .sentence-card.learned {
    border-color: rgba(46,160,67,0.4);
    background: rgba(46,160,67,0.05);
  }
  .sentence-card.learned::before {
    background: linear-gradient(180deg, #2ea043, #7ee787);
  }
  .card-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--lao-gold);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .lao-text {
    font-family: 'Noto Sans Lao', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #f8e4a0;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .pronunciation {
    font-size: 13px;
    color: #90caf9;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .korean {
    font-size: 14px;
    color: var(--text2);
    font-weight: 400;
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .speak-btn:hover {
    border-color: var(--lao-gold);
    color: var(--lao-gold);
    background: rgba(243,156,18,0.1);
  }
  .speak-btn.playing {
    border-color: var(--lao-red);
    color: var(--lao-red);
    background: rgba(192,57,43,0.1);
  }
  .learn-btn {
    margin-left: auto;
    padding: 6px 14px;
    border: none;
    border-radius: 50px;
    background: rgba(46,160,67,0.15);
    color: #7ee787;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    border: 1px solid rgba(46,160,67,0.3);
    transition: all 0.2s;
  }
  .learn-btn:hover { background: rgba(46,160,67,0.25); }
  .learn-btn.done {
    background: rgba(46,160,67,0.3);
    border-color: #2ea043;
  }

  /* 학습 완료 버튼 */
  .complete-btn {
    width: 100%;
    padding: 16px;
    margin-top: 16px;
    border: none;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--lao-red), #e74c3c, var(--lao-gold));
    background-size: 200% auto;
    color: white;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .complete-btn:hover {
    background-position: right center;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(192,57,43,0.4);
  }
  .complete-btn:disabled {
    background: var(--surface2);
    color: var(--text2);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* 복습 섹션 */
  .review-banner {
    background: linear-gradient(135deg, rgba(26,35,126,0.5), rgba(40,53,147,0.3));
    border: 1px solid rgba(63,81,181,0.5);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .review-banner .icon { font-size: 28px; }
  .review-banner h3 { font-size: 15px; font-weight: 700; color: #90caf9; }
  .review-banner p { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* 퀴즈 모드 */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    margin-bottom: 16px;
  }
  .quiz-question {
    font-family: 'Noto Sans Lao', sans-serif;
    font-size: 32px;
    color: #f8e4a0;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .quiz-hint { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-option {
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .quiz-option:hover { border-color: var(--lao-gold); color: var(--lao-gold); }
  .quiz-option.correct { background: rgba(46,160,67,0.2); border-color: #2ea043; color: #7ee787; }
  .quiz-option.wrong { background: rgba(192,57,43,0.2); border-color: var(--lao-red); color: #ff7b6b; }

  /* 통계 */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--lao-gold), var(--lao-red));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* 알림 토스트 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--lao-gold);
    border-radius: 50px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--lao-gold);
    transition: transform 0.3s cubic-bezier(.4,2,.6,1);
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 오늘 날짜 정보 */
  .day-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .day-info-left h2 { font-size: 18px; font-weight: 700; }
  .day-info-left p { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .day-badge {
    background: linear-gradient(135deg, var(--lao-red), var(--lao-gold));
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 50px;
  }

  .hidden { display: none; }

  /* 반응형 */
  @media (max-width: 480px) {
    .day-selector { grid-template-columns: repeat(6, 1fr); }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .quiz-options { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="header-flag">🇱🇦</span>
    <h1>마트 라오어 30일 완성</h1>
    <div class="lao-subtitle">ພາສາລາວสำหรับซูเปอร์มาร์เก็ต</div>
    <p>하루 10문장 · 마트 실용 회화 · 발음 듣기 포함</p>
    <div class="progress-bar-wrap" style="margin-top:16px">
      <div class="progress-bar" id="mainProgress" style="width:0%"></div>
    </div>
    <div class="progress-label" id="mainProgressLabel">0 / 30일 완료</div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('learn')">📚 학습</button>
    <button class="tab" onclick="showTab('quiz')">🎯 퀴즈</button>
    <button class="tab" onclick="showTab('translate')">🔤 번역</button>
    <button class="tab" onclick="showTab('stats')">📊 통계</button>
  </div>

  <!-- 학습 탭 -->
  <div id="tab-learn">
    <!-- 날짜 선택 -->
    <div class="section-title">📅 30일 커리큘럼</div>
    <div class="day-selector" id="daySelector"></div>

    <!-- 오늘 학습 영역 -->
    <div id="learningArea"></div>
  </div>

  <!-- 퀴즈 탭 -->
  <div id="tab-quiz" class="hidden">
    <div class="section-title">🎯 퀴즈</div>
    <div id="quizArea">
      <div class="quiz-card" style="padding:40px; color: var(--text2);">
        <div style="font-size:40px; margin-bottom:12px">🎮</div>
        <p>학습한 날의 문장으로 퀴즈를 풀어보세요.<br>날짜를 먼저 완료하면 퀴즈가 활성화됩니다.</p>
        <button class="complete-btn" style="max-width:200px; margin:20px auto 0;" onclick="startQuiz()">퀴즈 시작</button>
      </div>
    </div>
  </div>


  <!-- 번역 탭 -->
  <div id="tab-translate" class="hidden">
    <div class="section-title">🔤 한국어 → 라오어 번역</div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;">
      <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">단어나 문장을 입력하면 라오어로 번역해드려요.</p>

      <textarea id="translateInput" placeholder="예) 이 상품 얼마예요? / 냉동 생선 / 감사합니다..."
        style="width:100%;height:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
               color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;padding:12px;
               resize:none;outline:none;line-height:1.6;"
        oninput="clearTranslateResult()"></textarea>

      <div style="display:flex;gap:8px;margin-top:10px;">
        <button onclick="doTranslate()"
          style="flex:1;padding:12px;background:linear-gradient(135deg,var(--lao-red),#e74c3c);
                 border:none;border-radius:8px;color:white;font-size:14px;font-weight:700;
                 font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
          🔤 번역하기
        </button>
        <button onclick="document.getElementById('translateInput').value='';clearTranslateResult();"
          style="padding:12px 16px;background:var(--surface2);border:1px solid var(--border);
                 border-radius:8px;color:var(--text2);font-size:13px;cursor:pointer;">
          ✕
        </button>
      </div>
    </div>

    <!-- 결과 -->
    <div id="translateResult" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;">
      <div style="font-size:11px;color:var(--text2);letter-spacing:2px;margin-bottom:10px;">번역 결과</div>
      <div id="translateLao" style="font-family:'Noto Sans Lao',sans-serif;font-size:26px;color:#f8e4a0;font-weight:600;line-height:1.5;margin-bottom:8px;"></div>
      <div id="translatePron" style="font-size:13px;color:#90caf9;margin-bottom:16px;"></div>
      <button id="translateSpeakBtn" onclick="speakTranslate()"
        style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;
               border:1px solid var(--border);border-radius:50px;background:var(--surface2);
               color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        ▶ 발음 듣기
      </button>
    </div>

    <!-- 자주 쓰는 말 -->
    <div class="section-title" style="margin-top:24px;">⭐ 자주 쓰는 말 바로 번역</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;">
      <button onclick="quickTranslate('얼마예요?')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        얼마예요?
      </button>
      <button onclick="quickTranslate('감사합니다')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        감사합니다
      </button>
      <button onclick="quickTranslate('잠깐만요')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        잠깐만요
      </button>
      <button onclick="quickTranslate('품절됐어요')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        품절됐어요
      </button>
      <button onclick="quickTranslate('봉투 드릴까요?')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        봉투 드릴까요?
      </button>
      <button onclick="quickTranslate('카드 되나요?')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        카드 되나요?
      </button>
      <button onclick="quickTranslate('영수증 드릴게요')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">
        영수증 드릴게요
      </button>
      <button onclick="quickTranslate('이거 뭐예요?')"
        style="padding:7px 14px;background:var(--surface2);border:1px solid var(--border);
               border-radius:50px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;">

// ===================== 날짜 셀렉터 렌더링 =====================
function renderDaySelector() {
  const container = document.getElementById('daySelector');
  container.innerHTML = '';
  for (let d = 1; d <= 30; d++) {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = d + '일';
    
    const isCompleted = state.completed.includes(d);
    const isAvailable = d === 1 || state.completed.includes(d - 1) || isCompleted;
    const isCurrent = !isCompleted && isAvailable;
    
    if (isCompleted) btn.classList.add('completed');
    else if (isCurrent) btn.classList.add('current');
    else if (isAvailable) btn.classList.add('available');
    else btn.classList.add('locked');
    
    if (isAvailable || isCompleted) {
      btn.onclick = () => selectDay(d);
    }
    container.appendChild(btn);
  }
  updateProgress();
}

function updateProgress() {
  const pct = (state.completed.length / 30) * 100;
  document.getElementById('mainProgress').style.width = pct + '%';
  document.getElementById('mainProgressLabel').textContent = `${state.completed.length} / 30일 완료 (${Math.round(pct)}%)`;
}

// ===================== 날짜 선택 =====================
function selectDay(day) {
  currentDay = day;
  renderLearningArea(day);
}

function renderLearningArea(day) {
  const area = document.getElementById('learningArea');
  const dayData = curriculum[day - 1];
  const isCompleted = state.completed.includes(day);
  const prevDay = day - 1;
  const hasPrev = prevDay >= 1 && state.completed.includes(prevDay);
  const learnedToday = state.learned[day] || [];
  
  let html = '';

  // 날짜 정보
  html += `<div class="day-info">
    <div class="day-info-left">
      <h2>${dayData.theme} ${dayData.title}</h2>
      <p>${day}일차 · 10문장 · 마트 실전 회화</p>
    </div>
    <div class="day-badge">${isCompleted ? '✓ 완료' : day + '일차'}</div>
  </div>`;

  // 복습 섹션 (전날 완료했을 때)
  if (hasPrev && day > 1) {
    const prevData = curriculum[prevDay - 1];
    html += `<div class="review-banner">
      <div class="icon">🔄</div>
      <div>
        <h3>${prevDay}일차 복습: ${prevData.title}</h3>
        <p>어제 배운 문장을 먼저 복습해요!</p>
      </div>
    </div>`;
    html += `<div class="section-title">📖 복습 (${prevDay}일차)</div>`;
    prevData.sentences.forEach((s, i) => {
      html += renderSentenceCard(s, i, `prev-${prevDay}`, true);
    });
    html += `<div style="margin: 20px 0"></div>`;
  }

  // 오늘 학습
  html += `<div class="section-title">✏️ 오늘 학습 (${day}일차)</div>`;
  dayData.sentences.forEach((s, i) => {
    const isLearned = learnedToday.includes(i);
    html += renderSentenceCard(s, i, `today-${day}`, false, isLearned);
  });

  const allLearned = dayData.sentences.every((_, i) => learnedToday.includes(i));
  
  if (!isCompleted) {
    html += `<button class="complete-btn" id="completeBtn" ${allLearned ? '' : 'disabled'} onclick="completeDay(${day})">
      ${allLearned ? '✅ 오늘 학습 완료하기!' : `📝 문장을 모두 학습하세요 (${learnedToday.length}/10)`}
    </button>`;
  } else {
    html += `<div style="text-align:center; padding:20px; color: #7ee787; font-size:14px;">🎉 ${day}일차 완료! 다음 날로 이동하세요.</div>`;
  }

  area.innerHTML = html;
}

  const cardId = `card-${group}-${i}`;
  const btnId = `learn-${group}-${i}`;
  const speakId = `speak-${group}-${i}`;

  return `<div class="sentence-card ${isLearned ? 'learned' : ''}" id="${cardId}">
    <div class="card-num">${isReview ? '복습' : '학습'} ${i + 1}</div>
    <div class="lao-text">${s.lao}</div>

      <button class="speak-btn" id="${speakId}" data-lao="${s.lao}" onclick="speakFromBtn(this)">▶ 발음 듣기</button>

// ===================== 발음 재생 (Google Translate TTS - 라오스어) =====================
let _currentAudio = null;

async function speakLao(lao, btn) {
  const clean = lao.replace(/\/[^\s]*/g, '').trim();
  if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
  if (btn) { btn.classList.add('playing'); btn.textContent = '⏸ 읽는 중...'; }
  const resetBtn = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '▶ 발음 듣기'; } };

  try {
    const ttsUrl = `https://translate.googleapis.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(clean)}&tl=lo&client=gtx&sl=lo`;
    const audio = new Audio(ttsUrl);
    _currentAudio = audio;
    audio.onended = () => { resetBtn(); _currentAudio = null; };
    audio.onerror = () => { resetBtn(); fallbackTTS(clean, btn); };
    await audio.play();
  } catch(e) {
    fallbackTTS(clean, btn);
  }
}

function fallbackTTS(text, btn) {
  const resetBtn = () => { if (btn) { btn.classList.remove('playing'); btn.textContent = '▶ 발음 듣기'; } };
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'lo';
    utter.rate = 0.8;
    utter.onend = resetBtn;
    utter.onerror = () => { resetBtn(); showPronPopup(text); };
    window.speechSynthesis.speak(utter);
  } catch(e) {
    resetBtn();
    showPronPopup(text);
  }
}

// ===================== 학습 완료 마킹 =====================
function markLearned(day, sentenceIdx) {
  if (!state.learned[day]) state.learned[day] = [];
  if (!state.learned[day].includes(sentenceIdx)) {
    state.learned[day].push(sentenceIdx);
    save();
  }
  renderLearningArea(day);
}

function completeDay(day) {
  const learnedToday = state.learned[day] || [];
  if (learnedToday.length < 10) {
    showToast('📝 모든 문장을 학습해 주세요!');
    return;
  }
  if (!state.completed.includes(day)) {
    state.completed.push(day);
    save();
  }
  renderDaySelector();
  renderLearningArea(day);
  showToast(`🎉 ${day}일차 완료! 대단해요!`);
  updateStats();
}

async function doTranslate(text) {
  const input = text || document.getElementById('translateInput').value.trim();
  if (!input) { showToast('번역할 내용을 입력해주세요!'); return; }

  resultBox.style.display = 'block';

  try {
    // 1단계: 한국어 → 라오어 번역
    const url1 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=lo&dt=t&q=${encodeURIComponent(input)}`;
    const res1 = await fetch(url1);
    const data1 = await res1.json();
    const thaiText = data1[0].map(x => x[0]).join('');

    _translateLao = thaiText;
    thaiEl.textContent = thaiText;

    // 2단계: 태국어 자체를 한글 발음으로 변환 (로마자 없이 직접 변환)
    try {
      const korPron = thaiToKorean(thaiText);
      // 로마자도 참고용으로 시도
      let romaji = '';
      try {
        const url2 = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=en&dt=t&dt=rm&q=${encodeURIComponent(thaiText)}`;
        const res2 = await fetch(url2);
        const data2 = await res2.json();
        if (data2[0] && data2[0][0] && data2[0][0][3]) {
          romaji = data2[0].map(x => (x[3] || '')).join('').trim();
        }
      } catch(e) {}

      pronEl.innerHTML =
        `<span style="color:#90caf9;font-size:15px;font-weight:600;line-height:1.8;">🔊 ${korPron}</span>`
        + (romaji ? `<br><span style="color:var(--text2);font-size:11px;">${romaji}</span>` : '');
    } catch(e2) {
      pronEl.innerHTML = '<span style="color:var(--text2);font-size:12px;">발음 표시 실패</span>';
    }

  } catch(e) {
    thaiEl.textContent = '번역 실패 — 인터넷 연결을 확인해주세요';
    pronEl.innerHTML = '';
  }
}

    'อยู่':'유','ที่ไหน':'티나이','ชั้น':'찬',
    'เลี้ยว':'리아우','ซ้าย':'싸이','ขวา':'콰',
    'ห้องน้ำ':'헝남','ลิฟต์':'립','มี':'미','หมด':'못',
    'แมว':'매우','ปลา':'쁠라','ข้าว':'카오','น้ำ':'남',
    'ร้าน':'란','ขาย':'카이','ถูก':'툭','แพง':'팽',
    'ดี':'디','มาก':'막','น้อย':'노이','เปิด':'쁘엇',
    'ปิด':'삣','วัน':'완','ใหญ่':'야이','เล็ก':'렉',
    'ร้อน':'런','เย็น':'옌','ขอ':'커','ไป':'빠이',
    'มา':'마','หนึ่ง':'능','สอง':'쏭','สาม':'쌈',
    'ห้า':'하','หก':'혹','เก้า':'까오',
    'ถุง':'퉁','เอา':'아오','กล่อง':'끌롱',
    'อร่อย':'아로이','กิน':'낀','ซื้อ':'쓰',
  };

  // 부분 매칭
  let result = '';
  let i = 0;
  while (i < word.length) {
    let matched = false;
    for (let len = Math.min(10, word.length - i); len >= 1; len--) {
      const chunk = word.substring(i, i + len);
      if (syllableMap[chunk]) {
        result += syllableMap[chunk];
        i += len;
        matched = true;
        break;
      }
    }
    if (!matched) { i++; } // 모르는 자모는 스킵
  }
  return result || '?';
}

// 로마자(태국어 romanization) → 한글 발음 변환
function romajiToKorean(romaji) {
  if (!romaji) return '';
  // 공백/하이픈 기준으로 음절 분리 후 각각 변환
  return romaji.split(/\s+/).map(word => convertWord(word)).join(' ');
}

function convertWord(w) {
  w = w.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return '';

  // 태국어 로마자 → 한글 변환 규칙 (길이순 우선)
  const rules = [
    // 자음 클러스터 (3자)
    ['ngh','응'],['thr','트'],['phr','프'],['khr','크'],
    // 자음 클러스터 (2자)
    ['th','ท'],['ph','프'],['kh','크'],['ng','응'],['ch','ช'],
    ['tr','뜨'],['pr','쁘'],['kr','끄'],['pl','쁠'],['kl','끌'],
    ['wh','우'],
    // 이중모음 (2자)
    ['ae','แอ'],['ao','อาว'],['ai','อาย'],['ay','อาย'],
    ['oe','เออ'],['oo','อู'],['ua','อัว'],['ia','เอีย'],
    ['eu','เอ'],['aw','ออ'],['ue','อือ'],['oi','ออย'],['ui','อุ้ย'],
    // 단자음
    ['p','ป'],['b','บ'],['t','ต'],['d','ด'],['k','ก'],['g','ก'],
    ['m','ม'],['n','น'],['l','ล'],['r','ร'],['w','ว'],['y','ย'],
    ['h','ห'],['f','ฝ'],['s','ส'],['v','ว'],['j','จ'],['c','ค'],
    // 단모음
    ['a','า'],['i','ิ'],['u','ุ'],['e','เ'],['o','โ'],
  ];

  // 태국 문자 → 한글 소리
  const sound = {
    'ป':'ป→빠','บ':'บ→바','ต':'ต→따','ด':'ด→다','ก':'ก→까','ม':'ม→마',
    'น':'น→나','ล':'ล→라','ร':'ร→라','ว':'ว→와','ย':'ย→야','ห':'ห→하',
    'ฝ':'ฝ→파','ส':'ส→싸','จ':'จ→짜','ค':'ค→카','ช':'ช→차',
    'ท':'ท→타','า':'아','ิ':'이','ุ':'우','เ':'에','โ':'오',
    'แอ':'แอ→แอ','อาว':'อาว→아오','อาย':'อาย→아이','เออ':'เออ→เออ',
    'อู':'อู→우','อัว':'อัว→우아','เอีย':'เอีย→이아','เอ':'เอ→에',
    'ออ':'ออ→오','อือ':'อือ→으','ออย':'ออย→오이','อุ้ย':'อุ้ย→우이',
    '응':'응','뜨':'뜨','쁘':'쁘','끄':'끄','쁠':'쁠','끌':'끌','우':'우','프':'프','크':'크',
  };

  // 직접 음절 한글 발음 사전 (가장 자주 나오는 태국어 음절)
  const directSyllable = {
    'sa':'싸','si':'씨','se':'세','so':'쏘','su':'쑤',
    'ka':'까','ki':'끼','ke':'께','ko':'꼬','ku':'꾸',
    'kha':'카','khi':'키','khe':'케','kho':'코','khu':'쿠',
    'ta':'따','ti':'띠','te':'떼','to':'또','tu':'뚜',
    'tha':'타','thi':'티','the':'테','tho':'토','thu':'투',
    'pa':'빠','pi':'삐','pe':'뻬','po':'뽀','pu':'뿌',
    'pha':'파','phi':'피','phe':'페','pho':'포','phu':'푸',
    'ba':'바','bi':'비','be':'베','bo':'보','bu':'부',
    'da':'다','di':'디','de':'데','do':'도','du':'두',
    'ma':'마','mi':'미','me':'메','mo':'모','mu':'무',
    'na':'나','ni':'니','ne':'네','no':'노','nu':'누',
    'la':'라','li':'리','le':'레','lo':'로','lu':'루',
    'ra':'라','ri':'리','re':'레','ro':'로','ru':'루',
    'wa':'와','wi':'위','we':'웨','wo':'워',
    'ya':'야','yi':'이','ye':'예','yo':'요','yu':'유',
    'ha':'하','hi':'히','he':'헤','ho':'호','hu':'후',
    'fa':'파','fi':'피','fe':'페','fo':'포','fu':'푸',
    'ja':'짜','ji':'찌','je':'쩨','jo':'쪼','ju':'쭈',
    'cha':'차','chi':'치','che':'체','cho':'초','chu':'추',
    'nga':'응아','ngi':'응이','nge':'응에','ngo':'응오','ngu':'응우',
    'nai':'나이','mai':'마이','rai':'라이','pai':'빠이','sai':'싸이',
    'kan':'깐','man':'만','nan':'난','lan':'란','tan':'딴',
    'ang':'앙','eng':'엥','ing':'잉','ong':'옹','ung':'웅',
    'an':'안','en':'엔','in':'인','on':'온','un':'운',
    'am':'암','em':'엠','im':'임','om':'옴','um':'움',
    'at':'앗','it':'잇','ot':'옷','ut':'웃','et':'엣',
    'ak':'악','ik':'익','ok':'옥','uk':'욱','ek':'엑',
    'ap':'압','ip':'입','op':'옵','up':'웁','ep':'엡',
    'ao':'아오','ai':'아이','ae':'แอ','aw':'오','oe':'เอ',
    'krap':'크랍','khrap':'크랍','kha':'카','khop':'컵','khun':'쿤',
    'mai':'마이','chai':'차이','pen':'뻰','dai':'다이',
    'tao':'타오','rai':'라이','tang':'탕','mot':'못',
    'ngan':'응안','sot':'쏫','ton':'떤','bai':'바이',
    'set':'쎗','rot':'롯','sip':'씹','lod':'롯',
    'yu':'유','nai':'나이','chan':'찬','nit':'닛',
    'nueng':'능','song':'쏭','sam':'쌈',
    'ha':'하','hok':'혹','jet':'쩻','kao':'까오',
    'di':'디','dee':'디','mai':'마이',
    'wat':'왓','rat':'랏','bat':'밧',
    'phon':'폰','khong':'컹','khon':'콘',
    'rap':'랍','cap':'짭',
    'rian':'리안','phasa':'파사',
    'sawat':'사왓','wat':'왓',
    'yin':'인','dee':'디','ton':'떤',
    'khob':'컵','khun':'쿤',
    'laew':'래우','phop':'폽',
  };

  // 먼저 직접 매핑 시도
  if (directSyllable[w]) return directSyllable[w];

  // 없으면 규칙 기반 변환
  let result = '';
  let i = 0;
  while (i < w.length) {
    let matched = false;
    for (let len = Math.min(4, w.length - i); len >= 1; len--) {
      const chunk = w.substring(i, i + len);
      const rule = rules.find(r => r[0] === chunk);
      if (rule) {
        const mapped = rule[1];
        // 태국 문자가 있으면 소리 변환
        result += sound[mapped] ? sound[mapped].split('→')[1] : mapped;
        i += len;
        matched = true;
        break;
      }
    }
    if (!matched) { result += w[i]; i++; }
  }
  return result || w;
}

// ===================== 퀴즈 =====================
function startQuiz() {
  if (state.completed.length === 0) {
    showToast('📚 먼저 학습을 완료해 주세요!');
    return;
  }
  
  // 완료한 날들에서 랜덤 문장 10개
  let pool = [];
  state.completed.forEach(d => {
    curriculum[d-1].sentences.forEach(s => pool.push({...s, day: d}));
  });
  
  pool = pool.sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
  quizState = { questions: pool, currentQ: 0, score: 0, answered: false };
  renderQuiz();
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  if (quizState.currentQ >= quizState.questions.length) {
    area.innerHTML = `<div class="quiz-card">
      <div style="font-size:60px; margin-bottom:16px">🏆</div>
      <h2 style="font-size:24px; margin-bottom:8px; font-family: 'Noto Sans KR', sans-serif;">${quizState.score} / ${quizState.questions.length}</h2>
      <p style="color: var(--text2); margin-bottom:24px;">
        ${quizState.score >= 8 ? '완벽해요! 🎉' : quizState.score >= 5 ? '잘 했어요! 👍' : '계속 연습해요! 💪'}
      </p>
      <button class="complete-btn" style="max-width:200px; margin: 0 auto;" onclick="startQuiz()">다시 풀기</button>
    </div>`;
    return;
  }
  
  const q = quizState.questions[quizState.currentQ];
  const wrongPool = curriculum.flatMap(d => d.sentences).filter(s => s.lao !== q.thai);
  const wrongs = wrongPool.sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = [...wrongs, q].sort(() => Math.random() - 0.5);
  
  area.innerHTML = `<div class="quiz-card">
    <div style="font-size:12px; color: var(--text2); margin-bottom:12px">${quizState.currentQ + 1} / ${quizState.questions.length}</div>
    <div class="quiz-question">${q.lao}</div>
    <div class="quiz-hint">이 라오어의 뜻은?</div>
    <div class="quiz-options">
      ${opts.map((o, i) => `<button class="quiz-option" onclick="answerQuiz(${i}, '${o.kr}', '${q.kr}')">${o.kr}</button>`).join('')}
    </div>
  </div>`;
}

function answerQuiz(idx, selected, correct) {
  if (quizState.answered) return;
  quizState.answered = true;
  
  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach(b => {
    if (b.textContent === correct) b.classList.add('correct');
    else if (b.textContent === selected && selected !== correct) b.classList.add('wrong');
    b.onclick = null;
  });
  
  if (selected === correct) quizState.score++;
  
  setTimeout(() => {
    quizState.currentQ++;
    quizState.answered = false;
    renderQuiz();
  }, 1200);
}

// ===================== 통계 =====================
function updateStats() {
  const totalSentences = state.completed.length * 10;
  document.getElementById('statDays').textContent = state.completed.length;
  document.getElementById('statSentences').textContent = totalSentences;
  
  // 연속 학습일 계산
  let streak = 0;
  let sorted = [...state.completed].sort((a,b) => b-a);
  for (let i = 0; i < sorted.length; i++) {
    if (i === 0 || sorted[i-1] - sorted[i] === 1) streak++;
    else break;
  }
  document.getElementById('statStreak').textContent = streak;
  
  // 상세 현황
  const detail = document.getElementById('statsDetail');
  let dHtml = '';
  for (let w = 0; w < 6; w++) {
    dHtml += `<div style="display:flex; gap:6px; margin-bottom:8px;">`;
    for (let d = 1; d <= 5; d++) {
      const day = w * 5 + d;
      if (day > 30) break;
      const done = state.completed.includes(day);
      const avail = day === 1 || state.completed.includes(day-1);
      dHtml += `<div style="flex:1; background:${done ? 'rgba(46,160,67,0.2)' : avail ? 'var(--surface2)' : 'var(--surface)'}; border:1px solid ${done ? '#2ea043' : 'var(--border)'}; border-radius:8px; padding:8px 4px; text-align:center; font-size:11px; color:${done ? '#7ee787' : 'var(--text2)'};">
        <div>${day}일</div>
        <div>${done ? '✓' : avail ? '→' : '🔒'}</div>
      </div>`;
    }
    dHtml += `</div>`;
  }
  detail.innerHTML = dHtml;
}

// ===================== 토스트 =====================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===================== 초기화 =====================
renderDaySelector();
// 첫날 자동 선택
const firstAvailable = state.completed.length + 1 <= 30 ? state.completed.length + 1 : 30;
selectDay(firstAvailable);
updateStats();
</script>
